name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Biçim, analiz, test ve web derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: Web derlemesi
        # Uygulama GitHub Pages'te /<repo-adı>/ altında yayınlanır.
        run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=AI_GRADER_URL=${{ vars.AI_GRADER_URL }}
          --dart-define=AI_GRADER_KEY=${{ vars.AI_GRADER_KEY }}

      - name: Pages için yükle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: GitHub Pages'e yayınla
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
